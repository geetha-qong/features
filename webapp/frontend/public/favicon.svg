<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    QONG Studio favicon — Q ring + S inside, brand gradient #8B3FCE → #C73FBE → #FF4DA8.
    The Q identifies "QONG"; the S identifies the "Studio" variant.
    32x32 viewBox; strokes sized so the Q is still recognisable at 16x16 (browser tab).
  -->
  <defs>
    <linearGradient id="qsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B3FCE"/>
      <stop offset="55%" stop-color="#C73FBE"/>
      <stop offset="100%" stop-color="#FF4DA8"/>
    </linearGradient>
  </defs>

  <!-- Q ring -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="url(#qsGrad)" stroke-width="3.5"/>
  <!-- Q tail (the diagonal flick at lower-right of a Q) -->
  <path d="M 22 22 L 28 28" fill="none" stroke="url(#qsGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!--
    S — drawn as a single path so it renders identically regardless of system fonts.
    Two stacked half-bowls, offset like a cursive S. Sized to sit inside the Q ring.
  -->
  <path
    d="M 20.5 11.5
       C 20.5 9.5, 18.5 8.5, 16 8.5
       C 13.5 8.5, 11.5 9.7, 11.5 11.6
       C 11.5 13.5, 13.5 14.3, 16 14.8
       C 18.5 15.3, 20.5 16.2, 20.5 18.4
       C 20.5 20.3, 18.5 21.5, 16 21.5
       C 13.5 21.5, 11.5 20.5, 11.5 18.5"
    fill="none"
    stroke="url(#qsGrad)"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
