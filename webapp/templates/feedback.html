{% extends "base.html" %}
{% block title %}Share Feedback — Qong{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <h4 class="mb-1">Share Feedback</h4>
    <p class="text-muted mb-4">Bug, feature request, or anything else — we read every submission.</p>

    {% if success is defined and success %}
    <div class="alert alert-success">{{ success }}</div>
    {% else %}
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post" action="/feedback">
          <input type="hidden" name="page_url" value="{{ page_url }}">
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select name="category" class="form-select" required>
              <option value="bug">Bug report</option>
              <option value="feature">Feature request</option>
              <option value="pricing">Pricing / billing</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Subject</label>
            <input type="text" name="subject" class="form-control" required placeholder="Short description">
          </div>
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea name="message" class="form-control" rows="5" required
                      placeholder="Describe the issue or idea in detail…"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Submit Feedback</button>
        </form>
      </div>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
