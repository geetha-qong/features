<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Qong — P&ID Extractor{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body { background: #f8f9fa; }
    .navbar-brand img {
      height: 32px;
      width: auto;
      object-fit: contain;
      filter: brightness(0) invert(1); /* makes logo white on dark navbar */
    }
    .badge-pending    { background-color: #6c757d; }
    .badge-processing { background-color: #ffc107; color: #000; }
    .badge-done       { background-color: #198754; }
    .badge-failed     { background-color: #dc3545; }
    .valve-table th   { font-size: 0.8rem; white-space: nowrap; }
    .valve-table td   { font-size: 0.82rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">
        <img src="/imgs/67742-removebg-preview.png" alt="Qong">
      </a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          {% if user is defined and user %}
            <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/register">Create User</a></li>
            <li class="nav-item"><span class="nav-link text-secondary">{{ user.username }}</span></li>
            <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
          {% else %}
            <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    {% if error is defined and error %}
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        {{ error }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
