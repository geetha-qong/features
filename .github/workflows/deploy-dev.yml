name: Deploy → dev.qongsystems.com

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GSP_DEV_SSH_KEY }}

      - name: Add GCP VM to known hosts
        run: ssh-keyscan -t ed25519 34.126.93.103 >> ~/.ssh/known_hosts

      - name: Deploy to GCP VM
        run: |
          ssh maahedev@34.126.93.103 << 'ENDSSH'
          set -e
          cd /app/qong_poc
          git fetch origin dev
          git checkout dev
          git reset --hard origin/dev
          sudo docker compose build web cpu-worker
          sudo docker compose up -d web cpu-worker
          sudo docker compose restart nginx
          echo "Deploy complete: $(git log -1 --format='%h %s')"
          ENDSSH
