name: Deploy → dev.qongsystems.com

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret exists
        run: |
          if [ -z "${{ secrets.GSP_DEV_SSH_KEY }}" ]; then
            echo "GCP_SSH_KEY is EMPTY — secret not found or wrong name"
          else
            echo "GCP_SSH_KEY is SET (length: $(echo -n '${{ secrets.GSP_DEV_SSH_KEY }}' | wc -c) chars)"
          fi

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GSP_DEV_SSH_KEY }}

      - name: Add GCP VM to known hosts
        run: ssh-keyscan -t ed25519 34.124.148.51 >> ~/.ssh/known_hosts

      - name: Deploy to GCP VM
        run: |
          ssh maahedev@34.124.148.51 << 'ENDSSH'
          set -e
          cd /app/qong_poc
          git fetch origin dev
          git checkout dev
          git pull origin dev
          sudo docker compose build web cpu-worker
          sudo docker compose up -d web cpu-worker
          sudo docker compose restart nginx
          echo "Deploy complete: $(git log -1 --format='%h %s')"
          ENDSSH
