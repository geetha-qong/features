path: datasets/pid_valves   # relative to cwd (project root on host, /app in Docker)
train: images/train
val: images/val

nc: 13
# Order matches Label Studio YOLO export (classes.txt — alphabetical)
names:
  0: actuator_motor  # Motor box with M label (square)
  1: actuator_pneu   # Pneumatic dome / diaphragm
  2: actuator_sol    # Solenoid coil or SL text box
  3: inst_bubble     # Instrument tag circle (PT, TT, FT, LT, PDT, PI, PS, ZS, etc.) — OCR reads type
  4: inst_cv         # Control/shutdown valve symbol (FCV, XV) — looks like valve with actuator
  5: inst_solenoid   # Solenoid instrument symbol (FY, XY)
  6: valve_bf        # Butterfly valve — bowtie/diamond on pipe
  7: valve_bv        # Ball valve — circle with line through it
  8: valve_ck        # Check valve — arrowhead / half-circle
  9: valve_cv        # Control valve — circle with actuator dome
  10: valve_db       # Double Block & Bleed — cluster of 3 small symbols
  11: valve_gen      # Generic (VM, VG, NV, SV, UZV, PV, FV)
  12: valve_gl       # Globe valve — circle with internal plug
