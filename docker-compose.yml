services:

  # ── Production webapp (FastAPI) ────────────────────────────────────────────
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
      - "100.127.190.88:8000:8000"   # Tailscale — GPU worker on Windows reads tiles + callback via this
    volumes:
      - ./uploads:/app/uploads
      - ./job_outputs:/app/job_outputs
      - webapp_db:/app/data
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - LS_API_KEY=${LS_API_KEY}
      - LS_URL=http://label-studio:8080
      - LS_EXTERNAL_URL=${LS_EXTERNAL_URL:-http://localhost:9001}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/webapp.db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - STORAGE_ENDPOINT_URL=${STORAGE_ENDPOINT_URL:-http://minio:9000}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-qong-local}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-minioadmin}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-minioadmin}
      - STORAGE_REGION=${STORAGE_REGION:-us-east-1}
      - GPU_CALLBACK_SECRET=${GPU_CALLBACK_SECRET}
      - WEBAPP_BASE_URL=${WEBAPP_BASE_URL:-https://dev.qongsystems.com}
      - GPU_INTERNAL_BASE_URL=${GPU_INTERNAL_BASE_URL:-http://100.127.190.88:8000}
    restart: unless-stopped

  # ── Label Studio (annotation tool) ────────────────────────────────────────
  # Usage:
  #   docker compose up label-studio
  #   Open http://localhost:8080, create account, then create a project.
  #   Import images from annotate/tiles/ (they are mounted at /tiles inside container).
  #   Use label_studio_config.xml for the labelling interface config.
  #   Export annotations as YOLO format → save ZIP to annotate/exports/
  label-studio:
    image: heartexlabs/label-studio:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ls_data:/label-studio/data                 # named volume — survives deploys, not tracked by git
      - ./annotate/tiles:/tiles:ro                 # P&ID tiles (read-only)
      - ./annotate/exports:/label-studio/exports   # exported annotations land here
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/tiles
      - LABEL_STUDIO_CSRF_TRUSTED_ORIGINS=https://dev.qongsystems.com
      - LABEL_STUDIO_HOST=https://dev.qongsystems.com/ls
      - LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK=true
      - DJANGO_DB=default
      - POSTGRE_HOST=postgres
      - POSTGRE_PORT=5432
      - POSTGRE_USER=qong
      - POSTGRE_PASSWORD=${POSTGRES_PASSWORD:-qong}
      - POSTGRE_NAME=label_studio
    depends_on:
      - postgres
    restart: unless-stopped

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  # Production: https://dev.qongsystems.com (GCP, ports 80/443 with SSL)
  # Local dev override: use docker-compose.override.yml to swap ports to 9000/9001
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/ls_htpasswd:/etc/nginx/ls_htpasswd:ro
    depends_on:
      - web
      - label-studio
    restart: unless-stopped

  # ── Label Studio MCP server ───────────────────────────────────────────────
  # Exposes the Label Studio MCP over SSE at http://localhost:8090/sse
  # Claude Code (.claude/settings.json) connects to this URL.
  label-studio-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "127.0.0.1:8090:8000"
    environment:
      - LABEL_STUDIO_URL=http://label-studio:8080
      - LABEL_STUDIO_API_KEY=${LS_API_KEY}
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8000
    depends_on:
      - label-studio
    restart: unless-stopped

  # ── YOLO training ──────────────────────────────────────────────────────────
  # Usage:
  #   First run (train from scratch):
  #     docker compose run --rm trainer python3 train.py
  #   Resume:
  #     docker compose run --rm trainer python3 train.py --resume
  #   Export to ONNX after training:
  #     docker compose run --rm trainer python3 train.py --export runs/detect/pid_valves_v1/weights/best.pt
  #
  # GPU note: if you have an NVIDIA GPU add these lines under trainer:
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  trainer:
    build:
      context: .
      dockerfile: Dockerfile.trainer
    volumes:
      - ./datasets:/app/datasets          # YOLO dataset (images + labels + data.yaml)
      - ./runs:/app/runs                  # training output / checkpoints
      - ./models:/app/models              # final ONNX model goes here
      - ./annotate/tiles:/app/annotate/tiles:ro
    working_dir: /app
    restart: "no"

  # ── MinIO (S3-compatible local object storage) ────────────────────────────
  # API:     http://localhost:9100  (mapped from container :9000)
  # Console: http://localhost:9101  (mapped from container :9001)
  # Credentials: minioadmin / minioadmin
  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:9100:9000"   # S3 API — set STORAGE_ENDPOINT_URL=http://localhost:9100
      - "127.0.0.1:9101:9001"   # MinIO web console (localhost only — not public)
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MinIO bucket initialiser (runs once then exits) ────────────────────────
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb -p local/qong-local || true
      "
    restart: "no"

  # ── PostgreSQL (local dev — production uses same image on GCP VM) ──────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=qong
      - POSTGRES_PASSWORD=qong
      - POSTGRES_DB=qong
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qong"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis (job queue broker) ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
      - "100.127.190.88:6379:6379"   # Tailscale — GPU worker on Windows reads this
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── CPU RQ worker (runs pipeline.py jobs from the 'cpu' queue) ───────────────────
  cpu-worker:
    build: .
    command: python3 workers/cpu_worker.py
    volumes:
      - ./uploads:/app/uploads
      - ./job_outputs:/app/job_outputs
      - webapp_db:/app/data
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/webapp.db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - STORAGE_ENDPOINT_URL=${STORAGE_ENDPOINT_URL:-http://minio:9000}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-qong-local}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-minioadmin}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-minioadmin}
      - STORAGE_REGION=${STORAGE_REGION:-us-east-1}
      - LS_API_KEY=${LS_API_KEY}
      - LS_URL=http://label-studio:8080
      - LS_EXTERNAL_URL=${LS_EXTERNAL_URL:-http://localhost:9001}
      - WEBAPP_BASE_URL=${WEBAPP_BASE_URL:-https://dev.qongsystems.com}
      - GPU_CALLBACK_SECRET=${GPU_CALLBACK_SECRET}
      - GPU_INTERNAL_BASE_URL=${GPU_INTERNAL_BASE_URL:-http://100.127.190.88:8000}
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

volumes:
  webapp_db:
  minio_data:
  postgres_data:
  ls_data:
