# Local-dev override — auto-loaded by `docker compose up` (no -f needed).

services:
  web:
    ports: !override
      - "127.0.0.1:8000:8000"
    volumes:
      - ./webapp:/app/webapp
      - ./tests:/app/tests

  cpu-worker:
    volumes:
      - ./webapp:/app/webapp

  postgres:
    ports: !override
      - "127.0.0.1:5436:5432"
    environment: !override
      - POSTGRES_PASSWORD=qong_dev_password

  redis:
    ports: !override
      - "127.0.0.1:6388:6379"

  label-studio:
    ports: !override
      - "127.0.0.1:8084:8080"
    environment:
      - LABEL_STUDIO_HOST=http://localhost:8084
      - LABEL_STUDIO_CSRF_TRUSTED_ORIGINS=http://localhost:8084,http://localhost:5173,http://localhost:8000
      - LABEL_STUDIO_LEGACY_API_TOKEN_ENABLED=true

  nginx:
    ports: !override
      - "127.0.0.1:9004:80"
      - "127.0.0.1:9005:443"

  minio:
    ports: !override
      - "127.0.0.1:9110:9000"
      - "127.0.0.1:9111:9001"

  label-studio-mcp:
    ports: !override
      - "127.0.0.1:8093:8000"
