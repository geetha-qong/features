<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QONG Systems — Marketing UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css?v=4">
<link rel="stylesheet" href="site.css?v=4">
<link rel="icon" href="../../assets/qong-mark.png">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Social.jsx"></script>
<script type="text/babel" src="Drive.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Sections.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [active, setActive] = useState('home');
  const [toast, setToast] = useState(null);
  const [theme, setTheme] = useState(() => localStorage.getItem('qong-theme') || 'light');

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    document.body.setAttribute('data-theme', theme);
    localStorage.setItem('qong-theme', theme);
  }, [theme]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2400);
    return () => clearTimeout(t);
  }, [toast]);

  useEffect(() => { window.lucide && window.lucide.createIcons(); }, [active, theme]);

  const navigate = (key) => {
    setActive(key);
    const el = document.getElementById(key);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  const fireToast = (msg) => setToast(msg);
  const toggleTheme = () => setTheme((t) => (t === 'dark' ? 'light' : 'dark'));

  return (
    <React.Fragment>
      <QongNav active={active} onNavigate={navigate} theme={theme} onThemeToggle={toggleTheme} />
      <QongHero onCTA={fireToast} />
      <QongAbout />
      <QongFeatures />
      <QongProblems />
      <QongCoreEngine />
      <QongProcess />
      <QongAdvantages />
      <QongSectors />
      <QongFAQ />
      <QongCTAStrip onCTA={fireToast} />
      <QongFooter />
      <div className={`toast ${toast ? 'show' : ''}`}>
        <span className="dot" />
        {toast || ''}
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
