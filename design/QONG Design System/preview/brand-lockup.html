<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hero lockup</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body {
    margin: 0; padding: 0;
    background:
      radial-gradient(ellipse at top right, rgba(139,63,206,0.25) 0%, transparent 60%),
      var(--ink-1000);
    background-image:
      radial-gradient(ellipse at top right, rgba(139,63,206,0.25) 0%, transparent 60%),
      linear-gradient(180deg, #0E1024 0%, #060710 100%);
    min-height: 280px;
    display: grid;
    place-items: center;
    font-family: var(--font-display);
    position: relative;
    overflow: hidden;
  }
  /* subtle dot grid */
  body::before {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
  }

  .lockup {
    padding: 36px 44px;
    position: relative;
    z-index: 1;
  }
  .ttl {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 88px;
    line-height: 0.92;
    letter-spacing: -0.005em;
    text-transform: uppercase;
    margin: 0;
  }
  .ttl .qong {
    background: var(--qong-gradient-pink);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 4px 24px rgba(255,77,168,0.35));
  }
  .ttl .beyond { color: #FFFFFF; }
  .ttl .plant  { color: #7E839A; }

  .sub {
    margin-top: 18px;
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #6B6F8A;
  }
</style>
</head>
<body>
<div class="lockup">
  <div class="ttl">
    <div class="qong">QONG</div>
    <div class="beyond">BEYOND</div>
    <div class="plant">PLANT</div>
  </div>
  <div class="sub">AI-POWERED ENGINEERING</div>
</div>
</body>
</html>
