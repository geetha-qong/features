<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Display type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 28px; background: #fff; }
  .stack { display: grid; gap: 18px; }
  .row { display: grid; grid-template-columns: 92px 1fr; align-items: baseline; gap: 18px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.08em; padding-top: 10px; line-height: 1.35; }
  .specimen {
    font-family: var(--font-display);
    text-transform: uppercase;
    color: var(--fg-1);
    line-height: 0.95;
    letter-spacing: -0.005em;
  }
</style>
</head>
<body>
<div class="stack">
  <div class="row">
    <div class="meta">Impact<br>Barlow 900<br>64 px</div>
    <div class="specimen text-gradient" style="font-weight:900; font-size:64px;">BEYOND PLANT</div>
  </div>
  <div class="row">
    <div class="meta">Display<br>Barlow 800<br>44 px</div>
    <div class="specimen" style="font-weight:800; font-size:44px;">Redefining Intelligence</div>
  </div>
  <div class="row">
    <div class="meta">H2<br>Barlow 700<br>32 px</div>
    <div class="specimen" style="font-weight:700; font-size:32px;">Auto-Generated Deliverables</div>
  </div>
  <div class="row">
    <div class="meta">H4<br>Barlow 600<br>20 px</div>
    <div class="specimen" style="font-weight:600; font-size:20px;">AI-Powered P&ID Reading</div>
  </div>
</div>
</body>
</html>
