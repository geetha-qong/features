<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Violet wash + soft gradient</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
  .sw .chip { aspect-ratio: 2 / 1; }
  .sw .meta { padding: 8px 12px; font-family: var(--font-sans); }
  .sw .name { font-weight: 700; font-size: 12px; color: var(--fg); }
  .sw .hex { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 1px; }
  .wash { grid-column: span 4; aspect-ratio: 8/1; border-radius: 12px; background: var(--qong-gradient-soft); border: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; }
  .wash .lbl { font-family: var(--font-mono); font-size: 12px; color: var(--qong-purple); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="grid">
  <div class="wash"><span class="lbl">--qong-gradient-soft · feature section wash</span></div>
  <div class="sw"><div class="chip" style="background:#EDE6FB"></div><div class="meta"><div class="name">Violet 100</div><div class="hex">#EDE6FB</div></div></div>
  <div class="sw"><div class="chip" style="background:#D8C7F5"></div><div class="meta"><div class="name">Violet 200</div><div class="hex">#D8C7F5</div></div></div>
  <div class="sw"><div class="chip" style="background:#B89BEC"></div><div class="meta"><div class="name">Violet 300</div><div class="hex">#B89BEC</div></div></div>
  <div class="sw"><div class="chip" style="background:#9B6FE3"></div><div class="meta"><div class="name">Violet 400</div><div class="hex">#9B6FE3</div></div></div>
</div>
</body>
</html>
