<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand Palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; }
  .wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
  .sw .chip { aspect-ratio: 2.4 / 1; }
  .sw .meta { padding: 10px 12px; font-family: var(--font-sans); }
  .sw .name { font-weight: 700; font-size: 13px; color: var(--fg); letter-spacing: -0.01em; }
  .sw .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); margin-top: 2px; }
  .grad { grid-column: span 4; aspect-ratio: 10/1; border-radius: 12px; background: var(--qong-gradient); position: relative; box-shadow: var(--glow-brand-sm); }
  .grad .lbl { position: absolute; left: 16px; bottom: 12px; font-family: var(--font-mono); color: #fff; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="grad"><span class="lbl">--qong-gradient · the signature</span></div>
  <div class="sw"><div class="chip" style="background:#2E3FBE"></div><div class="meta"><div class="name">Qong Blue</div><div class="hex">#2E3FBE</div></div></div>
  <div class="sw"><div class="chip" style="background:#5347CC"></div><div class="meta"><div class="name">Qong Indigo</div><div class="hex">#5347CC</div></div></div>
  <div class="sw"><div class="chip" style="background:#8B3FCE"></div><div class="meta"><div class="name">Qong Purple · primary</div><div class="hex">#8B3FCE</div></div></div>
  <div class="sw"><div class="chip" style="background:#C73FBE"></div><div class="meta"><div class="name">Qong Magenta</div><div class="hex">#C73FBE</div></div></div>
</div>
</body>
</html>
