<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px 26px; background: #fff; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 80px; height: 60px; background: var(--qong-gradient-soft); border: 1px solid var(--border-strong); }
  .nm { font-family: var(--font-mono); font-size: 11px; color: var(--fg); font-weight: 600; }
  .px { font-family: var(--font-mono); font-size: 9px; color: var(--fg-3); }
</style>
</head>
<body>
<div class="grid">
  <div class="item"><div class="box" style="border-radius:0"></div><div class="nm">--r-0</div><div class="px">0 px</div></div>
  <div class="item"><div class="box" style="border-radius:4px"></div><div class="nm">--r-1</div><div class="px">4 px</div></div>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="nm">--r-2 · field</div><div class="px">8 px</div></div>
  <div class="item"><div class="box" style="border-radius:12px"></div><div class="nm">--r-3 · card</div><div class="px">12 px</div></div>
  <div class="item"><div class="box" style="border-radius:16px"></div><div class="nm">--r-4</div><div class="px">16 px</div></div>
  <div class="item"><div class="box" style="border-radius:999px"></div><div class="nm">--r-pill</div><div class="px">pill</div></div>
</div>
</body>
</html>
