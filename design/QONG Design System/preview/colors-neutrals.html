<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ink Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: repeat(12, 1fr); gap: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
  .cell { aspect-ratio: 1.2 / 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
  .cell .n { font-size: 10px; font-weight: 700; }
  .cell .h { font-family: var(--font-mono); font-size: 9px; opacity: 0.7; }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="lbl">Ink neutrals · industrial ramp · 1000 → 0</div>
<div class="row">
  <div class="cell" style="background:#0A0B14;color:#fff"><div class="n">1000</div><div class="h">#0A0B14</div></div>
  <div class="cell" style="background:#14162A;color:#fff"><div class="n">900</div><div class="h">#14162A</div></div>
  <div class="cell" style="background:#1E2138;color:#fff"><div class="n">800</div><div class="h">#1E2138</div></div>
  <div class="cell" style="background:#2A2E4A;color:#fff"><div class="n">700</div><div class="h">#2A2E4A</div></div>
  <div class="cell" style="background:#424766;color:#fff"><div class="n">600</div><div class="h">#424766</div></div>
  <div class="cell" style="background:#6B6F8A;color:#fff"><div class="n">500</div><div class="h">#6B6F8A</div></div>
  <div class="cell" style="background:#9498AE;color:#fff"><div class="n">400</div><div class="h">#9498AE</div></div>
  <div class="cell" style="background:#BFC2D2"><div class="n">300</div><div class="h">#BFC2D2</div></div>
  <div class="cell" style="background:#DCDFEA"><div class="n">200</div><div class="h">#DCDFEA</div></div>
  <div class="cell" style="background:#ECEEF5"><div class="n">100</div><div class="h">#ECEEF5</div></div>
  <div class="cell" style="background:#F6F7FB"><div class="n">50</div><div class="h">#F6F7FB</div></div>
  <div class="cell" style="background:#FFFFFF;border-left:1px solid var(--border)"><div class="n">0</div><div class="h">#FFFFFF</div></div>
</div>
</body>
</html>
