<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 26px; background: var(--ink-1000); font-family: var(--font-sans); }

  .stack { display: grid; gap: 18px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .meta {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-400);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }

  /* Brand button system — matches qongsystems.com */
  .btn {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 14px 28px;
    border-radius: 3px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 200ms cubic-bezier(0.16, 1, 0.3, 1);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    line-height: 1;
  }

  .btn-primary {
    background: var(--qong-gradient-pink);
    color: #fff;
    box-shadow: 0 8px 24px rgba(199, 63, 190, 0.35);
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, #C73FBE 0%, #E73FB0 50%, #FF4DA8 100%);
    box-shadow:
      0 0 0 1px rgba(255,77,168,0.4),
      0 0 24px rgba(255, 77, 168, 0.55),
      0 0 56px 6px rgba(160, 60, 200, 0.45);
    transform: translateY(-1px);
  }
  .btn-primary:active {
    transform: translateY(0);
    box-shadow: 0 0 16px rgba(255,77,168,0.4), 0 0 32px 2px rgba(160,60,200,0.35);
  }

  .btn-secondary {
    background: transparent;
    color: #fff;
    border-color: rgba(255, 255, 255, 0.16);
  }
  .btn-secondary:hover {
    border-color: var(--qong-magenta);
    color: var(--qong-magenta);
  }

  .btn-ghost {
    background: transparent;
    color: var(--qong-magenta);
    border-color: transparent;
    padding: 14px 16px;
  }
  .btn-ghost:hover { color: var(--qong-pink); }

  .btn-sm { padding: 10px 20px; font-size: 12px; }
</style>
</head>
<body>
<div class="stack">
  <div>
    <div class="meta">Primary &amp; Secondary · matches qongsystems.com · hover the primary to see the brand glow</div>
    <div class="row">
      <button class="btn btn-primary">Explore Platform</button>
      <button class="btn btn-secondary">Request Demo</button>
    </div>
  </div>
  <div>
    <div class="meta">Small &amp; Ghost</div>
    <div class="row">
      <button class="btn btn-primary btn-sm">Request Early Access</button>
      <button class="btn btn-ghost">See How It Works →</button>
    </div>
  </div>
</div>
</body>
</html>
