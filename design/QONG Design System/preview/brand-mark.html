<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QONG mark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; display: grid; place-items: center; }
  .frame { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; width: 100%; }
  .pane { display: grid; place-items: center; padding: 28px; }
  .light { background: #fff; }
  .dark  { background: var(--ink-1000); }
  img { width: 110px; height: 110px; object-fit: contain; }
  .lbl { position: absolute; bottom: 8px; left: 12px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
  .light .lbl { color: var(--fg-3); }
  .dark .lbl { color: var(--ink-400); }
  .pane { position: relative; }
</style>
</head>
<body>
<div class="frame">
  <div class="pane light"><img src="../assets/qong-mark.png" alt="QONG mark"><span class="lbl">on light</span></div>
  <div class="pane dark"><img src="../assets/qong-mark.png" alt="QONG mark"><span class="lbl">on ink-1000</span></div>
</div>
</body>
</html>
