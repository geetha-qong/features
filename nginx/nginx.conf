# Hide nginx version
server_tokens off;

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=register:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=api_upload:10m rate=10r/m;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name dev.qongsystems.com;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name dev.qongsystems.com;

    ssl_certificate     /etc/letsencrypt/live/dev.qongsystems.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.qongsystems.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    absolute_redirect off;
    client_max_body_size 100M;

    # Docker's embedded DNS — re-resolve upstream service names every 10s so
    # nginx doesn't cache stale container IPs after `docker compose up -d web`.
    # Using variables in proxy_pass (below) forces re-resolution per request.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_web "http://web:8000";
    set $upstream_ls  "http://label-studio:8080";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # CSP: allow self + Bootstrap CDN for static assets; restrict everything else
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com data:; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ── Label Studio at /ls/ ──────────────────────────────────────────────────
    # Note: variable-based proxy_pass appends the request URI instead of doing
    # location-prefix substitution. To strip /ls/ we rewrite the URI explicitly.
    location /ls/ {
        rewrite ^/ls/?(.*)$ /$1 break;
        proxy_pass $upstream_ls;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Script-Name /ls;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /ls { return 301 /ls/; }

    # LS SPA assets + API (hardcoded root-relative paths in LS frontend)
    location /api/ {
        proxy_pass $upstream_ls;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /static/ {
        proxy_pass $upstream_ls;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /react-app/ {
        proxy_pass $upstream_ls;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /media/ {
        proxy_pass $upstream_ls;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /data/ {
        proxy_pass $upstream_ls;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /user/ {
        proxy_pass $upstream_ls;
        proxy_redirect ~^/$ /ls/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /projects/ {
        proxy_pass $upstream_ls;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /organization/ {
        proxy_pass $upstream_ls;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /tasks/ {
        proxy_pass $upstream_ls;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /dm/ {
        proxy_pass $upstream_ls;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Rate-limit login endpoint
    location /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Rate-limit registration to prevent spam accounts
    location /register {
        limit_req zone=register burst=2 nodelay;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Rate-limit REST API upload endpoint
    location /api/v1/jobs {
        limit_req zone=api_upload burst=5 nodelay;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Webapp at / (public)
    location / {
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
