# HTTP → HTTPS redirect
server {
    listen 80;
    server_name dev.qongsystems.com;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name dev.qongsystems.com;

    ssl_certificate     /etc/letsencrypt/live/dev.qongsystems.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.qongsystems.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    absolute_redirect off;
    client_max_body_size 100M;

    # ── Label Studio — team-only basic auth ───────────────────────────────────
    # All LS paths require basic auth before LS login
    # Credentials: qong / Qong@LS2024
    auth_basic off;  # default off; overridden on LS blocks below

    location /ls/ {
        auth_basic "Qong Team Only";
        auth_basic_user_file /etc/nginx/ls_htpasswd;

        proxy_pass http://label-studio:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Script-Name /ls;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /ls { return 301 /ls/; }

    location /api/ {
        auth_basic "Qong Team Only";
        auth_basic_user_file /etc/nginx/ls_htpasswd;

        proxy_pass http://label-studio:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /static/ {
        auth_basic "Qong Team Only";
        auth_basic_user_file /etc/nginx/ls_htpasswd;
        proxy_pass http://label-studio:8080/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /react-app/ {
        auth_basic "Qong Team Only";
        auth_basic_user_file /etc/nginx/ls_htpasswd;
        proxy_pass http://label-studio:8080/react-app/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /media/ {
        auth_basic "Qong Team Only";
        auth_basic_user_file /etc/nginx/ls_htpasswd;
        proxy_pass http://label-studio:8080/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /data/ {
        auth_basic "Qong Team Only";
        auth_basic_user_file /etc/nginx/ls_htpasswd;
        proxy_pass http://label-studio:8080/data/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /user/ {
        auth_basic "Qong Team Only";
        auth_basic_user_file /etc/nginx/ls_htpasswd;

        proxy_pass http://label-studio:8080/user/;
        proxy_redirect ~^/$ /ls/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /projects/ {
        auth_basic "Qong Team Only";
        auth_basic_user_file /etc/nginx/ls_htpasswd;

        proxy_pass http://label-studio:8080/projects/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /organization/ {
        auth_basic "Qong Team Only";
        auth_basic_user_file /etc/nginx/ls_htpasswd;

        proxy_pass http://label-studio:8080/organization/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /tasks/ {
        auth_basic "Qong Team Only";
        auth_basic_user_file /etc/nginx/ls_htpasswd;

        proxy_pass http://label-studio:8080/tasks/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /dm/ {
        auth_basic "Qong Team Only";
        auth_basic_user_file /etc/nginx/ls_htpasswd;

        proxy_pass http://label-studio:8080/dm/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Webapp at / (no auth — public)
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
